<!doctype html>
<html lang="hy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#314d38">
  <title>Շնորհակալ ենք — Տարոն և Զոյա</title>
  <link rel="icon" href="assets/favicon.png">
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
      font-family:Georgia,"Times New Roman",serif;color:#314d38;
      background:radial-gradient(circle at 20% 20%,rgba(191,166,106,.18),transparent 30%),
      linear-gradient(135deg,#f8f5ec,#edf3ec)
    }
    main{
      width:min(620px,100%);padding:52px 28px;text-align:center;
      background:rgba(255,255,255,.94);border:1px solid rgba(191,166,106,.55);
      border-radius:30px;box-shadow:0 30px 80px rgba(49,77,56,.2)
    }
    .heart{font-size:2.5rem;color:#b79a58}
    h1{font-size:clamp(2rem,7vw,3.5rem);margin:14px 0}
    p{font-size:1.08rem;line-height:1.7}
    .names{font-size:1.45rem;color:#9b7f3f;margin:24px 0}
    a{display:inline-block;text-decoration:none;color:#fff;background:#49644f;
      padding:14px 26px;border-radius:999px}
  </style>
</head>
<body>
  <main>
    <div class="heart">♡</div>
    <h1>Շնորհակալ ենք 🤍</h1>
    <p>Ձեր մասնակցության պատասխանը հաջողությամբ ուղարկվել է։</p>
    <div class="names">Տարոն և Զոյա</div>
    <a href="/">Վերադառնալ հրավիրատոմսին</a>
  </main>
</body>
</html>
